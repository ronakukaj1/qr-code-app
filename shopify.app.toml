# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "359f8ba99521c0dc8017b27b369e26c5"
application_url = "https://example.com"
embedded = true
name = "QRCode-rona"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,read_products,read_customers,write_customers,customer_read_customers,customer_write_customers,customer_read_orders,customer_write_orders,write_metaobjects,write_metaobject_definitions,read_orders,write_orders,read_draft_orders,write_app_proxy,write_discounts,write_payment_customizations,write_delivery_customizations,write_cart_transforms"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[product.metafields.app.issues]
type = "json"
name = "Issue Tracker"
description = "Tracks issues logged for this product"

  [product.metafields.app.issues.access]
  admin = "merchant_read_write"

[metaobjects.app.qrcode]
name = "QRCode"
description = "Stores QR code data for products"

  [metaobjects.app.qrcode.access]
  admin = "merchant_read_write"

[metaobjects.app.qrcode.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.qrcode.fields.product]
name = "Product"
type = "product_reference"
required = true

[metaobjects.app.qrcode.fields.product_variant]
name = "Product Variant"
type = "variant_reference"
required = true

[metaobjects.app.qrcode.fields.destination]
name = "Destination"
type = "single_line_text_field"
required = true

[metaobjects.app.qrcode.fields.scan_count]
name = "Scans"
type = "number_integer"
required = true

[order.metafields.app.deliveryInstructions]
name = "Delivery instructions"
type = "multi_line_text_field"
capabilities.cart_to_order_copyable = true

  [order.metafields.app.deliveryInstructions.access]
  admin = "merchant_read_write"

[order.metafields.app.surveyAttribution]
name = "Survey response"
type = "single_line_text_field"

  [order.metafields.app.surveyAttribution.access]
  admin = "merchant_read_write"

[order.metafields.app.reportedProblem]
name = "Reported problem"
type = "single_line_text_field"
description = "Problem reported by the customer from the order action menu"

  [order.metafields.app.reportedProblem.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[order.metafields.app.orderNote]
name = "Order note"
type = "multi_line_text_field"
description = "Note added by the customer from the order action menu"

  [order.metafields.app.orderNote.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[order.metafields.app.loyaltyPointsAwarded]
name = "Loyalty points awarded"
type = "number_integer"
description = "Loyalty points credited to the customer for this order"

  [order.metafields.app.loyaltyPointsAwarded.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[events]
api_version = "unstable"

  [[events.subscription]]
  handle = "order-create-events"
  topic = "Order"
  actions = ["create"]
  uri = "pubsub://shopify-webhooks-505110:orders-create"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "draft_orders/create" ]
  uri = "pubsub://shopify-webhooks-505110:orders-create"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "/my-app-proxy"
prefix = "apps"
subpath = "qr-scan"

[customer.metafields.app.points]
type = "number_integer"
name = "Loyalty Points"
description = "Customer loyalty points earned through segment-based rewards"

  [customer.metafields.app.points.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[customer.metafields.app.wishlist]
name = "Wishlist"
type = "json"
description = "Product IDs saved to the customer's wishlist"

  [customer.metafields.app.wishlist.access]
  admin = "merchant_read_write"
  customer_account = "read_write"

[discount.metafields.app.function-configuration]
type = "json"
name = "Function configuration"
access.admin = "merchant_read_write"
access.storefront = "none"

[pos]
embedded = true

[sidekick]
extensions_summary = "Search QR codes for products, view scan counts and destinations, and find QR codes linked to specific products"